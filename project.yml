name: ScarletProbe
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  ScarletProbe:
    type: application
    platform: iOS
    sources:
      - path: ScarletProbe
      - path: Extensions/Shared
      - path: Extensions/AppIntents
    settings:
      base:
        PRODUCT_NAME: ScarletProbe
        PRODUCT_BUNDLE_IDENTIFIER: com.local.scarletprobe
        INFOPLIST_FILE: ScarletProbe/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScarletProbe/Resources/ScarletProbe.entitlements
    dependencies:
      - target: ScarletProbeWidget
        embed: true
        codeSign: false

  ScarletProbeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ScarletProbeWidget
      - path: Extensions/Shared
    settings:
      base:
        PRODUCT_NAME: ScarletProbeWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.local.scarletprobe.widget
        INFOPLIST_FILE: Extensions/ScarletProbeWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ScarletProbeWidget/ScarletProbeWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
